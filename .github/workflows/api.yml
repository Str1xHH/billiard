# Выкладка серверной части в Yandex Cloud.
# Ключей в репозитории нет: GitHub получает временный ключ через федерацию сервисных аккаунтов
# (Yandex Cloud пускает только этот репозиторий и только ветку main).
# Единственный секрет — GH_CLIENT_SECRET (секрет OAuth-приложения для входа через GitHub).
name: Сервер (Yandex Cloud)

on:
  push:
    branches: [main]
    paths: ['api/**', '.github/workflows/api.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: api-deploy
  cancel-in-progress: false

env:
  YC_FOLDER_ID: b1gudnliemlq7hh8tf88
  YC_DEPLOY_SA: aje6vrh354jdi0em3olj
  GH_CLIENT_ID: Ov23likGF77zgXGPX9HW
  FUNC: billiard-api
  RUNTIME_SA: billiard-api-sa
  BUCKET: billiard-b1gudnliemlq7hh8tf88
  APP_URL: https://str1xhh.github.io/billiard/

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверка кода
        run: node --check api/index.js && node api/test.js

      - name: Временный ключ Yandex Cloud
        run: |
          set -euo pipefail
          GH_JWT=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://github.com/Str1xHH" | jq -r .value)
          echo "::add-mask::$GH_JWT"
          RESP=$(curl -sS -X POST https://auth.yandex.cloud/oauth/token \
            --data-urlencode "grant_type=urn:ietf:params:oauth:grant-type:token-exchange" \
            --data-urlencode "requested_token_type=urn:ietf:params:oauth:token-type:access_token" \
            --data-urlencode "audience=$YC_DEPLOY_SA" \
            --data-urlencode "subject_token=$GH_JWT" \
            --data-urlencode "subject_token_type=urn:ietf:params:oauth:token-type:id_token")
          IAM=$(echo "$RESP" | jq -r '.access_token // empty')
          if [ -z "$IAM" ]; then echo "Yandex Cloud не выдал ключ: $RESP"; exit 1; fi
          echo "::add-mask::$IAM"
          echo "YC_IAM_TOKEN=$IAM" >> "$GITHUB_ENV"

      - name: Установить yc
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$HOME/yc" -n
          echo "$HOME/yc/bin" >> "$GITHUB_PATH"

      - name: Бакет, сервисный аккаунт, функция
        env:
          GH_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          yc config profile create ci >/dev/null 2>&1 || true
          yc config set folder-id "$YC_FOLDER_ID"

          # приватный бакет для данных
          if ! yc storage bucket get "$BUCKET" >/dev/null 2>&1; then
            yc storage bucket create --name "$BUCKET" --default-storage-class standard --max-size 2147483648
          fi

          # сервисный аккаунт, от имени которого работает функция: только чтение и запись в хранилище
          SA_ID=$(yc iam service-account get --name "$RUNTIME_SA" --format json 2>/dev/null | jq -r '.id // empty' || true)
          if [ -z "$SA_ID" ]; then
            SA_ID=$(yc iam service-account create --name "$RUNTIME_SA" --description "Функция billiard-api: доступ к бакету" --format json | jq -r .id)
          fi
          if ! yc resource-manager folder list-access-bindings "$YC_FOLDER_ID" --format json | jq -e --arg id "$SA_ID" '.[] | select(.role_id == "storage.editor" and .subject.id == $id)' >/dev/null; then
            yc resource-manager folder add-access-binding "$YC_FOLDER_ID" --role storage.editor --subject "serviceAccount:$SA_ID"
          fi

          if ! yc serverless function get --name "$FUNC" >/dev/null 2>&1; then
            yc serverless function create --name "$FUNC" --description "Бильярд: вход, друзья, таблица лидеров"
          fi
          if [ -z "$GH_CLIENT_SECRET" ]; then echo "::warning::Нет секрета GH_CLIENT_SECRET — вход через GitHub работать не будет"; fi
          yc serverless function version create \
            --function-name "$FUNC" \
            --runtime nodejs22 \
            --entrypoint index.handler \
            --memory 128m \
            --execution-timeout 15s \
            --source-path ./api \
            --service-account-id "$SA_ID" \
            --environment "BUCKET=$BUCKET,GH_CLIENT_ID=$GH_CLIENT_ID,GH_CLIENT_SECRET=$GH_CLIENT_SECRET,APP_URL=$APP_URL" >/dev/null
          yc serverless function allow-unauthenticated-invoke "$FUNC" >/dev/null
          FID=$(yc serverless function get --name "$FUNC" --format json | jq -r .id)
          echo "API_URL=https://functions.yandexcloud.net/$FID" >> "$GITHUB_ENV"
          echo "### Сервер: https://functions.yandexcloud.net/$FID" >> "$GITHUB_STEP_SUMMARY"

      - name: Проверка сервера
        run: |
          set -euo pipefail
          sleep 3
          OUT=$(curl -sS -X POST "$API_URL" -H 'Content-Type: text/plain' -d '{"a":"ping"}')
          echo "Ответ: $OUT"
          echo "$OUT" | jq -e '.ok == true' >/dev/null
          echo "API_URL: $API_URL"
